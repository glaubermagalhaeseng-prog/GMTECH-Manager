{% extends "base.html" %}


{% block title %}
Editar Serviço - GMTECH Manager
{% endblock %}



{% block content %}

{% if request.query_params.get('erro') %}
<div class="alert alert-danger alert-validacao mb-3">
    <i class="bi bi-exclamation-triangle-fill"></i>
    {{ request.query_params.get('erro') }}
</div>
{% endif %}




<div class="d-flex justify-content-between align-items-center mb-4">


    <h2>

        <i class="bi bi-pencil-square"></i>

        Editar Serviço

    </h2>



    <a href="/servicos" class="btn btn-gmtech">

        <i class="bi bi-arrow-left"></i>

        Voltar

    </a>


</div>




<div class="card card-dashboard p-4">



<form action="/servicos/editar/{{servico.id}}" method="post">





<h5 class="mb-3">

<i class="bi bi-tools"></i>

Dados do Serviço

</h5>





<div class="mb-3">


<label class="form-label">

Descrição

</label>


<input

type="text"

name="descricao"

class="form-control"

value="{{servico.descricao}}"

required

>


</div>





<div class="row">



<div class="col-md-6 mb-3">


<label class="form-label">

Categoria

</label>



<select 
name="categoria" 
class="form-select">



<option 
{% if servico.categoria == "Equipamento" %}selected{% endif %}>

Equipamento

</option>



<option 
{% if servico.categoria == "Material" %}selected{% endif %}>

Material

</option>



<option 
{% if servico.categoria == "Serviço" %}selected{% endif %}>

Serviço

</option>



<option 
{% if servico.categoria == "Mão de obra" %}selected{% endif %}>

Mão de obra

</option>



<option 
{% if servico.categoria == "Projeto" %}selected{% endif %}>

Projeto

</option>



<option 
{% if servico.categoria == "Manutenção" %}selected{% endif %}>

Manutenção

</option>



</select>


</div>





<div class="col-md-6 mb-3">


<label class="form-label">

Valor

</label>



<input

type="number"

step="0.01"

name="valor"

class="form-control"

value="{{servico.valor}}"

>


</div>



</div>





<div class="text-end">


<button 
type="submit"
class="btn btn-gmtech btn-lg">


<i class="bi bi-check-circle-fill"></i>


Salvar Alterações


</button>


</div>





</form>



</div>



{% endblock %}
