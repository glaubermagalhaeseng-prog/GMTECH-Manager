{% extends "base.html" %}

{% block title %}
Empresa
{% endblock %}


{% block content %}


<h2>
    Dados da Empresa
</h2>

<p class="text-muted">
    Informações utilizadas nas propostas e documentos da GMTECH.
</p>



<div class="card shadow-sm p-4">


<form method="post" action="/empresa/salvar">


<div class="row">


<div class="col-md-6 mb-3">

<label class="form-label">
Razão Social
</label>

<input 
type="text"
name="razao_social"
class="form-control"
value="{{ empresa.razao_social if empresa else '' }}"
>

</div>



<div class="col-md-6 mb-3">

<label class="form-label">
Nome Fantasia
</label>

<input 
type="text"
name="nome_fantasia"
class="form-control"
value="{{ empresa.nome_fantasia if empresa else '' }}"
>

</div>



<div class="col-md-4 mb-3">

<label class="form-label">
CNPJ
</label>

<input 
type="text"
name="cnpj"
class="form-control"
value="{{ empresa.cnpj if empresa else '' }}"
>

</div>



<div class="col-md-4 mb-3">

<label class="form-label">
Responsável
</label>

<input 
type="text"
name="responsavel"
class="form-control"
value="{{ empresa.responsavel if empresa else '' }}"
>

</div>



<div class="col-md-4 mb-3">

<label class="form-label">
CFT
</label>

<input 
type="text"
name="cft"
class="form-control"
value="{{ empresa.cft if empresa else '' }}"
>

</div>



<div class="col-md-6 mb-3">

<label class="form-label">
Telefone
</label>

<input 
type="text"
name="telefone"
class="form-control"
value="{{ empresa.telefone if empresa else '' }}"
>

</div>



<div class="col-md-6 mb-3">

<label class="form-label">
E-mail
</label>

<input 
type="email"
name="email"
class="form-control"
value="{{ empresa.email if empresa else '' }}"
>

</div>



<div class="col-md-8 mb-3">

<label class="form-label">
Endereço
</label>

<input 
type="text"
name="endereco"
class="form-control"
value="{{ empresa.endereco if empresa else '' }}"
>

</div>



<div class="col-md-3 mb-3">

<label class="form-label">
Cidade
</label>

<input 
type="text"
name="cidade"
class="form-control"
value="{{ empresa.cidade if empresa else '' }}"
>

</div>



<div class="col-md-1 mb-3">

<label class="form-label">
UF
</label>

<input 
type="text"
name="uf"
class="form-control"
value="{{ empresa.uf if empresa else '' }}"
>

</div>


</div>


<button class="btn btn-gmtech">

Salvar Dados

</button>


</form>


</div>


{% endblock %}
