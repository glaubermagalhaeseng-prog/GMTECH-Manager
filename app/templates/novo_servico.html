{% extends "base.html" %}


{% block title %}
Novo Serviço - GMTECH Manager
{% endblock %}



{% block content %}

{% if request.query_params.get('erro') %}
<div class="alert alert-danger alert-validacao mb-3">
    <i class="bi bi-exclamation-triangle-fill"></i>
    {{ request.query_params.get('erro') }}
</div>
{% endif %}




<div class="d-flex justify-content-between align-items-center mb-4">


    <h2>

        <i class="bi bi-plus-circle-fill"></i>

        Novo Serviço / Produto

    </h2>



    <a href="/servicos" class="btn btn-gmtech">

        <i class="bi bi-arrow-left"></i>

        Voltar

    </a>


</div>




<div class="card card-dashboard p-4">



<form action="/servicos/salvar" method="post">





<h5 class="mb-3">

<i class="bi bi-box-seam-fill"></i>

Dados do Serviço

</h5>




<div class="mb-3">


<label class="form-label">

Descrição

</label>


<input

type="text"

name="descricao" required

class="form-control"

placeholder="Ex: Instalação fotovoltaica 10kWp"

required

>


</div>





<div class="row">



<div class="col-md-6 mb-3">


<label class="form-label">

Categoria

</label>



<select 
name="categoria" 
class="form-select">


<option>

Equipamento

</option>


<option>

Material

</option>


<option>

Serviço

</option>


<option>

Mão de obra

</option>


<option>

Projeto

</option>


<option>

Manutenção

</option>



</select>



</div>





<div class="col-md-6 mb-3">


<label class="form-label">

Valor

</label>



<input

type="number"

step="0.01"

name="valor"

class="form-control"

placeholder="0,00"

>



</div>



</div>





<div class="text-end">


<button 
type="submit"
class="btn btn-gmtech btn-lg">


<i class="bi bi-check-circle-fill"></i>


Salvar Serviço


</button>


</div>





</form>



</div>



{% endblock %}
