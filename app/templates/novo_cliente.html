<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>Novo Cliente - GMTECH Manager</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">
<h2>Novo Cliente</h2>
</div>


<div class="card-body">


<form action="/clientes/salvar" method="post">


<h5 class="mb-3">Dados do Cliente</h5>


<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Nome / Razão Social</label>
<input type="text" name="nome" class="form-control" required>
</div>


<div class="col-md-6 mb-3">
<label class="form-label">CPF / CNPJ</label>
<input type="text" name="cpf_cnpj" class="form-control">
</div>

</div>



<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Telefone</label>
<input type="text" name="telefone" class="form-control">
</div>


<div class="col-md-6 mb-3">
<label class="form-label">E-mail</label>
<input type="email" name="email" class="form-control">
</div>

</div>



<hr>


<h5 class="mb-3">Endereço</h5>


<div class="row">

<div class="col-md-8 mb-3">
<label class="form-label">Rua</label>
<input type="text" name="rua" class="form-control">
</div>


<div class="col-md-4 mb-3">
<label class="form-label">Número</label>
<input type="text" name="numero" class="form-control">
</div>

</div>



<div class="row">

<div class="col-md-5 mb-3">
<label class="form-label">Bairro</label>
<input type="text" name="bairro" class="form-control">
</div>


<div class="col-md-5 mb-3">
<label class="form-label">Cidade</label>
<input type="text" name="cidade" class="form-control">
</div>


<div class="col-md-2 mb-3">
<label class="form-label">UF</label>
<input type="text" name="uf" class="form-control">
</div>

</div>



<hr>


<h5 class="mb-3">Informações Técnicas</h5>


<div class="row">


<div class="col-md-6 mb-3">

<label class="form-label">
Tipo de Cliente
</label>

<select name="tipo_cliente" class="form-select">

<option>Residencial</option>
<option>Comercial</option>
<option>Industrial</option>
<option>Rural</option>

</select>

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
Unidade Consumidora
</label>

<input type="text" name="unidade_consumidora" class="form-control">

</div>


</div>



<div class="mb-3">

<label class="form-label">
Observações Técnicas
</label>

<textarea name="observacoes" class="form-control" rows="4"></textarea>

</div>



<div class="text-end">

<button type="submit" class="btn btn-success btn-lg">
Salvar Cliente
</button>

</div>



</form>


</div>

</div>

</div>


</body>

</html>
