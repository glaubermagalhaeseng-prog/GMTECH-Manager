<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proposta assinada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f6f9;">
<div class="container" style="max-width:480px; margin-top:60px;">
    <div class="card shadow-sm p-4 text-center">
        <div style="font-size:48px; color:#198754;">✓</div>
        <h3 class="mt-2">Proposta assinada com sucesso!</h3>
        <p class="text-muted">
            Obrigado, <strong>{{ nome }}</strong>.<br>
            Sua assinatura foi registrada em {{ data }}.
        </p>
        <p class="small text-muted">
            A equipe entrará em contato para os próximos passos da instalação.
        </p>
    </div>
</div>
</body>
</html>
